<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <title>Unit Convertor</title>
  </head>
  <body>
    <div id="main-container">
      <h1 id="heading">Metric/Imperial Unit Conversion</h1>
      <input id="num-input" type="text">
      <br>
      <button id="convert-btn">Convert</button>
      <div id="sub-container">
        <div id="length-area" class="area">
            <h2 class="area-header">Length (Meter/Feet)</h2>
            <span class="area-data">placeholder text</span>
        </div>
        <div id="volume-area" class="area">
            <h2 class="area-header">Volume (Liters/Gallons)</h2>
            <span class="area-data">placeholder text</span>
        </div>
        <div id="mass-area" class="area">
            <h2 class="area-header">Mass (Kilograms/Pounds)</h2>
            <span class="area-data">placeholder text</span>
        </div>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
